<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Ana Sayfa - Başvuru Formu</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0; 
      padding: 0; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container { 
      max-width: 400px; 
      margin: 20px; 
      background: #fff; 
      padding: 40px; 
      border-radius: 15px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
      text-align: center; 
    }
    
    h1 {
      color: #333;
      margin-bottom: 30px;
      font-size: 24px;
    }
    
    .login-form {
      text-align: left;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: bold;
    }
    
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #3498db;
      outline: none;
    }
    
    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(to right, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .login-btn:hover {
      background: linear-gradient(to right, #2980b9, #2573a7);
      transform: translateY(-2px);
    }
    
    .error-message {
      color: #e74c3c;
      background: #fdf2f2;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      border: 1px solid #f5c6cb;
      display: none;
    }
    
    .links {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    
    .links a {
      display: block;
      margin: 10px 0;
      color: #3498db;
      text-decoration: none;
      font-weight: bold;
    }
    
    .links a:hover {
      color: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Berliner KIEL Aday Belgeleri</h1>
    
    <div id="errorMessage" class="error-message"></div>
    
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Kullanıcı Adı:</label>
        <input type="text" id="username" name="username" required>
      </div>
      
      <div class="form-group">
        <label for="password">Şifre:</label>
        <input type="password" id="password" name="password" required>
      </div>
      
      <button type="submit" class="login-btn">Giriş Yap</button>
    </form>
    
    <div class="links">
      <a href="/admin/">Admin Paneline Git</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      
      // Basit kullanıcı adı ve şifre kontrolü
      // Bu bilgileri güvenli bir şekilde saklamak için backend'de kontrol etmek daha iyi olur
      const validCredentials = [
        { username: 'admin', password: 'berliner2024' },
        { username: 'kiel', password: 'kiel123' },
        { username: 'berliner', password: 'berliner' }
      ];
      
      const isValid = validCredentials.some(cred => 
        cred.username === username && cred.password === password
      );
      
      if (isValid) {
        // Giriş başarılı - form sayfasına yönlendir
        window.location.href = "{% url 'form_page' %}";
      } else {
        errorMessage.textContent = 'Hatalı kullanıcı adı veya şifre!';
        errorMessage.style.display = 'block';
        
        // 3 saniye sonra hata mesajını gizle
        setTimeout(() => {
          errorMessage.style.display = 'none';
        }, 3000);
      }
    });

    // Enter tuşuna basıldığında da formu göndersin
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });
  </script>
</body>
</html>
